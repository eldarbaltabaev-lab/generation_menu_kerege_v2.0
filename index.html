<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<title>Меню → Word (по неделям)</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<main>
<h1>Меню → Word</h1>
<p class="sub">Загрузите недельное меню (.xlsx): выберите неделю — увидите все 7 дней сразу.</p>

<div class="card">
  <label class="lbl" for="file">1. Файл недельного меню</label>
  <div id="drop-zone" class="drop-zone">
    <input id="file" type="file" accept=".xlsx,.xlsm">
    <div class="drop-zone-prompt">
      <span style="font-size: 24px; display: block; margin-bottom: 8px;">📥</span>
      Перетащите файл сюда <br> или нажмите, чтобы выбрать
    </div>
  </div>
  <div id="msg" role="status" aria-live="polite"></div>
</div>

<div id="step2" class="card hide">
  <label class="lbl" for="weekSel">2. Неделя</label>
  <select id="weekSel"></select>

  <!-- КАРУСЕЛЬ -->
  <div class="carousel-wrapper">
    <button class="carousel-btn" id="prevWeekDay" title="Назад">❮</button>
    <div id="weekContainer" class="week-container"></div>
    <button class="carousel-btn" id="nextWeekDay" title="Вперед">❯</button>
  </div>

  <div class="actions">
    <button class="btn" id="weekDocx">📄 Скачать неделю (.docx ZIP)</button>
    <button class="btn alt" id="weekJpeg">🖼️ Скачать неделю (.jpeg ZIP)</button>
    <button class="btn alt" id="translateBtn">🌐 Перевести всё (Google)</button>
    <button class="btn alt" id="translateAiBtn">🤖 Перевести всё (ИИ)</button>
    <button class="btn" id="aiKeyBtn" style="margin-top:12px; font-size:13px; padding:8px;">⚙️ Настроить ИИ (API-ключ)</button>
  </div>
</div>

<div id="jpegContainer"></div>
</main>

<!-- ВАЖНО: Сначала script.js, затем script-translate.js -->
<script src="script.js"></script>
<script src="translater.js"></script>
</body>
</html>
